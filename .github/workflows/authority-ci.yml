name: Authority development CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/authority-bootstrap]
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/OfflineLicensing/OfflineLicensing.csproj --configuration Release
      - run: dotnet build tools/LicensePortal/LicensePortal.csproj --configuration Release
      - run: dotnet build tools/LicenseIssuerWorker/LicenseIssuerWorker.csproj --configuration Release
      - run: dotnet run --project tests/ReleaseManifestAcceptance/ReleaseManifestAcceptance.csproj --configuration Release

  postgres-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-admin
          POSTGRES_DB: gatewaycore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gatewaycore_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/checkout@v4
        with:
          repository: VY-Groups/yarp-lb
          ref: 58f55b98b253c023d0ec824f17e001c9677c1929
          path: customer-contract
          persist-credentials: false
      - name: Ensure PostgreSQL recovery client tools
        run: |
          if ! command -v pg_dump || ! command -v pg_restore; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          pg_dump --version
      - run: dotnet build tests/CustomerInterop/CustomerInterop.csproj --configuration Release
      - run: dotnet run --project tests/PostgresAcceptance/PostgresAcceptance.csproj --configuration Release
        env:
          GC_PG_TEST: Host=127.0.0.1;Port=5432;Database=gatewaycore_ci;Username=postgres;Password=disposable-ci-admin
          GC_CUSTOMER_INTEROP_DLL: ${{ github.workspace }}/tests/CustomerInterop/bin/Release/net10.0/CustomerInterop.dll
      - run: dotnet build tools/LicensePortal/LicensePortal.csproj --configuration Release
      - run: python3 tests/PortalAcceptance/https_mfa.py
  customer-protocol-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: VY-Groups/yarp-lb
          ref: 58f55b98b253c023d0ec824f17e001c9677c1929
          path: customer-contract
          persist-credentials: false
      - name: Verify exact shared protocol snapshot
        run: diff -ru src/GatewayCore.Licensing customer-contract/src/GatewayCore.Licensing
