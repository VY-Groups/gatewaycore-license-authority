name: Authority development CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/authority-bootstrap, feature/authority-recovery, feature/authority-billing, feature/authority-site-bound]
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate commercial package release script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'ops/release/build-commercial-packages.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: dotnet run --project tests/OfflineLicensing/OfflineLicensing.csproj --configuration Release
      - run: dotnet build tools/LicensePortal/LicensePortal.csproj --configuration Release
      - run: dotnet build tools/LicenseIssuerWorker/LicenseIssuerWorker.csproj --configuration Release
      - run: dotnet run --project tests/ReleaseManifestAcceptance/ReleaseManifestAcceptance.csproj --configuration Release

  postgres-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-admin
          POSTGRES_DB: gatewaycore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gatewaycore_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/checkout@v4
        with:
          repository: VY-Groups/yarp-lb
          ref: 961b4385f68f535671c48de6d3b3d4fc03220542
          path: customer-contract
          persist-credentials: false
      - name: Verify exact frozen customer checkout
        shell: bash
        run: test "$(git -C customer-contract rev-parse HEAD)" = "961b4385f68f535671c48de6d3b3d4fc03220542"
      - name: Ensure PostgreSQL recovery client tools
        run: |
          if ! command -v pg_dump || ! command -v pg_restore; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          pg_dump --version
      - run: dotnet build tests/CustomerInterop/CustomerInterop.csproj --configuration Release
      - run: dotnet run --project tests/PostgresAcceptance/PostgresAcceptance.csproj --configuration Release
        env:
          GC_PG_TEST: Host=127.0.0.1;Port=5432;Database=gatewaycore_ci;Username=postgres;Password=disposable-ci-admin
          GC_CUSTOMER_INTEROP_DLL: ${{ github.workspace }}/tests/CustomerInterop/bin/Release/net10.0/CustomerInterop.dll
      - run: dotnet build tools/LicensePortal/LicensePortal.csproj --configuration Release
      - name: Verify operator portal contains no legacy signing assembly
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          output=Path("tools/LicensePortal/bin/Release/net10.0")
          libraries=json.loads((output/"LicensePortal.deps.json").read_text())["libraries"]
          assert not any(name.startswith("LicenseAuthority/") for name in libraries), libraries.keys()
          assert not (output/"LicenseAuthority.dll").exists()
          assert not (output/"LicenseIssuerWorker.dll").exists()
          PY
      - run: python3 tests/PortalAcceptance/https_mfa.py
      - name: Actual company-signed packages and database-paid customer runtime
        run: dotnet run --project tests/CommercialCandidate/CommercialCandidate.csproj --configuration Release -- postgres
        env:
          GC_PG_TEST: Host=127.0.0.1;Port=5432;Database=gatewaycore_ci;Username=postgres;Password=disposable-ci-admin
  release-candidate-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/checkout@v4
        with:
          repository: VY-Groups/yarp-lb
          ref: 961b4385f68f535671c48de6d3b3d4fc03220542
          path: customer-contract
          persist-credentials: false
      - name: Verify exact frozen customer checkout
        shell: bash
        run: test "$(git -C customer-contract rev-parse HEAD)" = "961b4385f68f535671c48de6d3b3d4fc03220542"
      - run: dotnet run --project tests/CommercialCandidate/CommercialCandidate.csproj --configuration Release -- packages
  customer-protocol-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: VY-Groups/yarp-lb
          ref: 961b4385f68f535671c48de6d3b3d4fc03220542
          path: customer-contract
          persist-credentials: false
      - name: Verify exact frozen customer checkout
        shell: bash
        run: test "$(git -C customer-contract rev-parse HEAD)" = "961b4385f68f535671c48de6d3b3d4fc03220542"
      - name: Verify exact shared protocol snapshot
        run: diff -ru src/GatewayCore.Licensing customer-contract/src/GatewayCore.Licensing
